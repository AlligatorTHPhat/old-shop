apiVersion: 1
datasources:
  - name: Elasticsearch
    uid: elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    basicAuth: true
    basicAuthUser: elastic
    secureJsonData:
      basicAuthPassword: $ELASTIC_PASSWORD
    jsonData:
      index: "filebeat-*"
      timeField: "@timestamp"
      logMessageField: msg
      logLevelField: level
