apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        # Click a request_id in a log line to see every line of that request.
        - name: request_id
          matcherRegex: '"request_id":\s*"([^"]+)"'
          url: '{service="backend"} |= "$${__value.raw}"'
          datasourceUid: loki
