# Ships the stdout of every container in the `oldshop` compose project to Loki.
server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.project=oldshop"]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - target_label: env
        replacement: production
    pipeline_stages:
      - docker: {}

      # Backend: one JSON object per line (app/core/logging.py).
      - match:
          selector: '{service="backend"}'
          stages:
            - json:
                expressions:
                  level: level
                  logger: logger
                  request_id: request_id
                  status: status
                  ts: ts
            - timestamp:
                source: ts
                format: RFC3339Nano
            - labels:
                level:      # low cardinality only; request_id stays in the line
                logger:

      # Caddy access logs are JSON too.
      - match:
          selector: '{service="caddy"}'
          stages:
            - json:
                expressions:
                  level: level
            - labels:
                level:

      # Drop noisy health checks from Nginx.
      - match:
          selector: '{service="frontend"} |= "/healthz"'
          action: drop
