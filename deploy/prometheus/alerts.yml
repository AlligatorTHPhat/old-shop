# Evaluated by Prometheus and visible in Grafana > Alerting. Hook an Alertmanager or a Grafana
# contact point (Telegram, email...) to get notified.
groups:
  - name: oldshop
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Backend is not answering /metrics"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="backend",status="5xx"}[5m]))
            / clamp_min(sum(rate(http_requests_total{job="backend"}[5m])), 1e-9) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "More than 5% of API requests fail with 5xx"

      - alert: SlowApi
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_highr_seconds_bucket{job="backend"}[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "API p95 latency above 1s"

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "PostgreSQL is unreachable from the exporter"

      - alert: DiskAlmostFull
        expr: |
          node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}
            / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"} < 0.10
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Less than 10% disk left on /"
