name: oldshop-buckets
x-pg: &pg
  image: postgres:16-alpine
  command: [postgres, -c, shared_buffers=32MB, -c, max_connections=40, -c, timezone=UTC]
  environment: &pg-env
    POSTGRES_USER: bucket_admin
    POSTGRES_PASSWORD: ${BUCKET_PG_PASSWORD:?Run prepare-bucket-env.py}
  healthcheck:
    test: [CMD-SHELL, 'pg_isready -U bucket_admin -d "$$POSTGRES_DB"']
    interval: 3s
    timeout: 3s
    retries: 30
  mem_limit: 256m
  restart: unless-stopped
services:
  core:
    <<: *pg
    environment:
      <<: *pg-env
      POSTGRES_DB: oldshop_core
    ports: ["127.0.0.1:57630:5432"]
    volumes: [bucket_core:/var/lib/postgresql/data]
  site-a:
    <<: *pg
    environment:
      <<: *pg-env
      POSTGRES_DB: oldshop_1
    ports: ["127.0.0.1:57631:5432"]
    volumes: [bucket_a:/var/lib/postgresql/data]
  site-b:
    <<: *pg
    environment:
      <<: *pg-env
      POSTGRES_DB: oldshop_2
    ports: ["127.0.0.1:57632:5432"]
    volumes: [bucket_b:/var/lib/postgresql/data]
  site-c:
    <<: *pg
    profiles: [expansion]
    environment:
      <<: *pg-env
      POSTGRES_DB: oldshop_3
    ports: ["127.0.0.1:57633:5432"]
    volumes: [bucket_c:/var/lib/postgresql/data]
  mongo:
    image: mongo:8.0.32
    command: [mongod, --wiredTigerCacheSizeGB, "0.25", --bind_ip_all]
    environment:
      MONGO_INITDB_ROOT_USERNAME: bucket_admin
      MONGO_INITDB_ROOT_PASSWORD: ${BUCKET_MONGO_PASSWORD:?Run prepare-bucket-env.py}
    ports: ["127.0.0.1:57617:27017"]
    volumes: [bucket_mongo:/data/db]
    mem_limit: 512m
  neo4j:
    image: neo4j:2026.10.2
    environment:
      NEO4J_AUTH: neo4j/${BUCKET_GRAPH_PASSWORD:?Run prepare-bucket-env.py}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    ports: ["127.0.0.1:57687:7687", "127.0.0.1:57474:7474"]
    volumes: [bucket_graph:/data]
    mem_limit: 768m
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://localhost:7474 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
  backend:
    image: oldshop-bucket-backend:local
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment: &app-env
      DATABASE_URL: postgresql://bucket_admin:${BUCKET_PG_PASSWORD}@core:5432/oldshop_core
      BUCKET_SITE_URLS: '{"A":"postgresql://bucket_admin:${BUCKET_PG_PASSWORD}@site-a:5432/oldshop_1","B":"postgresql://bucket_admin:${BUCKET_PG_PASSWORD}@site-b:5432/oldshop_2","C":"postgresql://bucket_admin:${BUCKET_PG_PASSWORD}@site-c:5432/oldshop_3"}'
      BUCKET_MODE: "true"
      BUCKET_DATASET: ${BUCKET_DATASET:-demo-v2}
      SKIP_DB_INIT: "true"
      MONGO_URI: mongodb://bucket_admin:${BUCKET_MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: oldshop_buckets
      GRAPH_ENABLED: "true"
      GRAPH_GENERATION: ${GRAPH_GENERATION:-1}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${BUCKET_GRAPH_PASSWORD}
      SECRET_KEY: ${BUCKET_SECRET_KEY:?Run prepare-bucket-env.py}
      DEBUG: "false"
      WEB_CONCURRENCY: "1"
      MEDIA_DIR: /data/media
      DATABASE_SRC: /opt/database
    ports: ["127.0.0.1:57680:8000"]
    volumes: [bucket_media:/data/media]
    depends_on:
      core: {condition: service_healthy}
      site-a: {condition: service_healthy}
      site-b: {condition: service_healthy}
    mem_limit: 512m
  worker:
    image: oldshop-bucket-backend:local
    healthcheck: {disable: true} # Batch consumer has no HTTP server; inspect scripts.graph status.
    environment: *app-env
    entrypoint: [python, -m, scripts.graph, worker]
    volumes: [bucket_media:/data/media]
    restart: unless-stopped
    profiles: [app]
    mem_limit: 256m
  frontend:
    image: oldshop-bucket-frontend:local
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports: ["127.0.0.1:57600:8080"]
    depends_on: [backend]
    profiles: [app]
  tools:
    image: oldshop-bucket-tools:local
    healthcheck: {disable: true} # Interactive CLI container, not an HTTP service.
    build:
      context: ..
      dockerfile: backend/Dockerfile.bucket-tests
    environment:
      <<: *app-env
      DATABASE_SRC: /workspace/database
      PYTHONPATH: /workspace/backend
      MEDIA_DIR: /data/media
    working_dir: /workspace/backend
    volumes:
      - ..:/workspace:ro
      - bucket_media:/data/media
    profiles: [tools]
    mem_limit: 512m
volumes:
  bucket_core:
  bucket_a:
  bucket_b:
  bucket_c:
  bucket_mongo:
  bucket_graph:
  bucket_media:
