target-version = "py313"
line-length = 120

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",   # FastAPI uses function calls (Depends, Query...) in argument defaults
    "E712",   # SQLAlchemy filters need `== False` / `== True`
]

[lint.isort]
known-first-party = ["app"]
