name: Deploy

# Runs after CI succeeds on main (or manually): build images, push them to GHCR,
# then SSH into the VPS and run deploy/scripts/deploy.sh with the new tag.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to (re)deploy, e.g. a short SHA for a rollback. Empty = build current commit."
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    # Only commits pushed to this repository's main branch are built; a workflow_run coming from a fork's
    # pull request never reaches the checkout below.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.tag == '') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: vars
        # Image names must be lowercase; the GitHub owner name may not be.
        run: |
          echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.namespace }}/oldshop-backend:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.namespace }}/oldshop-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.namespace }}/oldshop-frontend:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.namespace }}/oldshop-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build
    if: always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      # Images are already in GHCR at this point; without a server configured there is nothing to roll out.
      - name: Skip when no VPS is configured
        if: env.VPS_HOST == ''
        run: echo "::notice title=Deploy skipped::Images were pushed to GHCR. Set the VPS_HOST, VPS_USER and VPS_SSH_KEY secrets to deploy automatically."

      - name: Deploy over SSH
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          TAG: ${{ inputs.tag || needs.build.outputs.tag }}
          REF: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: TAG,REF
          script: |
            set -e
            cd /opt/oldshop
            git fetch --quiet origin
            git checkout --quiet "$REF"
            deploy/scripts/deploy.sh "$TAG"
